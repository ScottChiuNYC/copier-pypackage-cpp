_min_copier_version: "9.19.1"
_subdirectory: template
_answers_file: .copier-answers.pypackage-cpp.yml

project_name:
  type: str
  default: "my_project"
project_slug:
  type: str
  default: "{{ project_name.lower().replace(' ', '-') }}"
module_name:
  type: str
  default: "{{ project_slug.replace('-', '_') }}"
  validator: >-
    {% if not (module_name | regex_search("^[A-Za-z_][A-Za-z0-9_]*$")) or module_name in ['False', 'None', 'True', 'and', 'as', 'assert', 'async', 'await', 'break', 'class', 'continue', 'def', 'del', 'elif', 'else', 'except', 'finally', 'for', 'from', 'global', 'if', 'import', 'in', 'is', 'lambda', 'nonlocal', 'not', 'or', 'pass', 'raise', 'return', 'try', 'while', 'with', 'yield'] %}Use a valid identifier.{% endif %}
description:
  type: str
  default: "Add your description here"
author_name:
  type: str
  default: "Your Name"
author_email:
  type: str
  default: "you@example.com"
version:
  type: str
  default: "0.1.0"
vcpkg_port_name:
  type: str
  default: "{{ module_name.lower().replace('_', '-').strip('-') }}-core"
  validator: >-
    {% if not (vcpkg_port_name | regex_search("^[a-z0-9]+(-[a-z0-9]+)*$")) or vcpkg_port_name == 'gtest' or vcpkg_port_name.startswith('vcpkg-') %}Use a lowercase vcpkg name with hyphens; gtest and vcpkg-* are reserved.{% endif %}
python_version:
  type: str
  default: ">=3.12"
cmake_min_version:
  type: str
  default: "3.25"
cpp_standard:
  type: str
  default: "17"
